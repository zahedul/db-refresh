[package]
name = "db-refresh"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1.13.3", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.161.0"
dioxus = { version = "0.7.10" }
rfd = "0.17.2"
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "process", "time"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt"] }

# Release builds: smaller, faster binary for the bundled .app.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
